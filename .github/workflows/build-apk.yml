name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "FireHome.zip"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar o projeto
        run: unzip -q FireHome.zip

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar o APK
        working-directory: FireHome
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar arquivo
        run: cp FireHome/app/build/outputs/apk/release/app-release.apk FireHome.apk

      - name: Guardar nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: FireHome-apk
          path: FireHome.apk

      - name: Publicar em Releases (link direto para baixar)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Fire Home APK
          files: FireHome.apk
          make_latest: true
