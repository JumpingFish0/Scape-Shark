name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar o projeto
        run: |
          rm -rf FireHome
          unzip -q -o FireHome.zip
          ls FireHome

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Aceitar licencas do Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar o APK
        id: build
        working-directory: FireHome
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee ../build.log

      - name: Mostrar os erros (se a compilacao falhou)
        if: failure()
        run: |
          {
            echo "## Erros da compilacao"
            echo '```'
            grep -E "^e: |error:|FAILED|What went wrong|Execution failed|Could not" build.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar o log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Preparar arquivo
        run: cp FireHome/app/build/outputs/apk/release/app-release.apk FireHome.apk

      - name: Guardar o APK nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: FireHome-apk
          path: FireHome.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Fire Home APK
          files: FireHome.apk
          make_latest: true
          
